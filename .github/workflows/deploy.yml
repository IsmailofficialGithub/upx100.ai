name: Deploy to Production EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Frontend
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch .env from EC2
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts
          scp ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:~/100xUp_live/frontend/.env ./frontend/.env || echo "No frontend .env found on server"

      - name: Install and Build Frontend
        working-directory: ./frontend
        run: |
          npm i --legacy-peer-deps
          npm run build
          
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: ./frontend/dist/
          retention-days: 1

  deploy:
    name: Deploy to EC2
    needs: build
    runs-on: ubuntu-latest
    environment: production
    
    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist

      - name: Copy Build to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "dist"
          target: "/home/ubuntu/temp_frontend_build"

      - name: Execute deployment script on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "Starting deployment..."
            
            # Navigate to project directory
            cd ~/100xUp_live
            
            # Pull latest code
            git pull origin main
            
            # Update and restart Backend
            echo "Installing backend dependencies..."
            cd Backend
            npm i
            
            echo "Restarting backend PM2 process..."
            pm2 restart 100xUp-backend
            
            # Deploy Frontend from SCP transfer
            echo "Deploying frontend to NGINX..."
            sudo cp -r /home/ubuntu/temp_frontend_build/dist/* /var/www/up100x_live/
            
            echo "Restarting NGINX..."
            sudo systemctl restart nginx
            
            # Cleanup temp build files
            rm -rf /home/ubuntu/temp_frontend_build
            
            echo "Deployment completed successfully!"
